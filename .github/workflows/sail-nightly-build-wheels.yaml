name: sail nightly build tilelang

on:
  schedule:
    # Daily at 14:00 UTC (22:00 Beijing time), after the FA and Triton nightlies.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and upload'
        required: true
        type: string
        default: tilelang
      framework:
        description: 'Name of the dependent framework, e.g. torch'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'JSON array; allowed values: 38, 310, 312'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; allowed values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; allowed HGGCRT versions: 2, 3'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON array; allowed values: 2.10.0, 2.13.0; [""] skips Torch installation'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'JSON array; allowed values: 2.1.1, 2.2.0, 2.2.1'
        required: true
        type: string
        default: '["2.2.1"]'
      branch:
        description: 'Source branch, tag, or full commit SHA; leave empty to use the commit that triggered the workflow'
        required: false
        type: string
        default: ''
      package_version:
        description: 'Artifactory package version and automatic upload directory prefix; must track the version in VERSION'
        required: true
        type: string
        default: 'dev'
      package_edition:
        description: 'Artifactory package edition; defaults to oe, matching the release workflow'
        required: true
        type: string
        default: oe
      package_type:
        description: 'Artifactory package type; defaults to pypi'
        required: false
        type: string
        default: pypi
      runs_on:
        description: 'Runner label; the TileLang build compiles TVM and needs the large self-hosted runner'
        required: false
        type: string
        default: x86-ubuntu2404-8-32
      build_command:
        description: 'Custom Bash build command; leave empty to build TileLang from the repository root; only trusted configuration is accepted'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-build-${{ inputs.package_name || 'tilelang' }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: t-head/ci-infra/.github/workflows/nightly-build.yml@main
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
    with:
      # Scheduled runs carry no inputs; the pinned defaults below still apply.
      # Keep them aligned with the PPU CI image: sdk2.2.1 / torch2.13.0 /
      # hggcrt3 / ubuntu24.04 / py312.
      package_name: ${{ inputs.package_name || 'tilelang' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: t-head/ci-infra
      template_ref: main
      # The build compiles TVM plus the TileLang sources, so the 16 GB hosted
      # runner is too small in both memory and disk.
      runs_on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on || 'x86-ubuntu2404-8-32' }}
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["3"]' }}
      # Torch is a runtime dependency only; CMake never looks for it, so the
      # empty entry skips the install.
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.1"]' }}
      branch: ${{ inputs.branch || '' }}
      package_version: ${{ inputs.package_version || 'dev' }}
      package_edition: ${{ inputs.package_edition || 'oe' }}
      package_type: ${{ inputs.package_type || 'pypi' }}
      build_command: |
        ${{ inputs.build_command || 'unset PIP_INDEX_URL
        source /usr/local/PPU_SDK/envsetup.sh || true
        which hgcc || true
        echo "$PPU_SDK"
        # Drop any image-bundled tilelang so the fresh wheel is the only candidate.
        pip uninstall -y tilelang || true
        # Same build tooling as the CI wheel recipe; setuptools is pinned for
        # scikit-build-core.
        pip install wheel build setuptools cython packaging "setuptools==68.1.2"
        # Keep the ppu/git local version label; the collector rewrites the
        # version segment after the build anyway.
        export NO_VERSION_LABEL=OFF
        rm -rf build dist
        python3 -m build --wheel
        ls -lh dist/*.whl' }}
